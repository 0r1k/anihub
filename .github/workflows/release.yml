name: release

# Push a tag `vX.Y` (equal to the version in pyproject.toml) to publish a GitHub release.
# `anihub update` installs the latest release, `releases/latest/download/anihub.tar.gz` is the install link.
# The release is published only after the whole build matrix passed for the tagged commit, with the dist it tested.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # tomllib
          python-version: "3.12"
          enable-cache: false

      - name: The tag matches the project version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the release; no other job can write to the repository
    steps:
      # built and tested on ubuntu with python 3.12 by the build workflow above
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Stable install link
        run: cp dist/anihub-*.tar.gz dist/anihub.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "anihub ${GITHUB_REF_NAME#v}" --generate-notes
