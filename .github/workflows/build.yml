name: build

# The wheel is pure python (py3-none-any): build it on every OS and check that it installs
# and runs on Linux, macOS and Windows with the oldest and newest supported python.
# Dependencies are resolved anew on every run, as `uv tool install` does for users: the weekly run
# finds a new release of a dependency that breaks anihub, the `lowest` job checks the lower bounds.
# The `lint` job runs ruff and mypy with the versions locked in uv.lock.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  # release.yml runs it for the tagged commit and publishes the dist built here
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    # ruff and mypy at the versions of uv.lock: CI and `uv run --all-extras ...` on a laptop agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # --locked: fails if uv.lock is out of date with pyproject.toml; --all-extras: mypy sees rookiepy too
      - name: Install the locked environment
        run: uv sync --locked --all-extras

      - name: ruff check
        run: uv run --locked --all-extras ruff check anihub tests

      - name: ruff format
        run: uv run --locked --all-extras ruff format --check anihub tests

      - name: mypy
        run: uv run --locked --all-extras mypy anihub

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # the same commands (and wheel globs) on Windows
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # UV_PYTHON for every uv command below
          python-version: ${{ matrix.python }}
          # nothing restored from earlier runs: the newest versions from PyPI, and the release builds from scratch
          enable-cache: false

      - name: Build wheel and sdist
        run: uv build

      # the sdist, as the install link of the README (anihub.tar.gz) gives it to users
      - name: Install as a uv tool
        run: |
          uv tool install dist/anihub-*.tar.gz
          anihub version
          anihub --help

      # `pytest`, not `python -m pytest`: the source checkout in the working directory must not shadow the wheel
      - name: Tests (the installed wheel, offline)
        env:
          ANIHUB_TEST_INSTALLED: "1"
        run: uv run --no-project --isolated --with dist/anihub-*.whl --with pytest pytest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  lowest:
    # the direct dependencies at the oldest versions pyproject.toml allows, on the oldest python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: false

      - name: Build wheel
        run: uv build --wheel

      - name: Oldest allowed versions
        run: uv pip compile pyproject.toml --resolution lowest-direct --output-file "$RUNNER_TEMP/lowest.txt"

      - name: Tests (the installed wheel, offline)
        env:
          ANIHUB_TEST_INSTALLED: "1"
        run: uv run --no-project --isolated --with-requirements "$RUNNER_TEMP/lowest.txt" --with dist/anihub-*.whl --with pytest pytest
