name: build

# The wheel is pure python (py3-none-any): build it once per OS and check that it installs
# and runs on Linux, macOS and Windows with the oldest and newest supported python.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # the same commands (and wheel globs) on Windows
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Install as a uv tool
        run: |
          uv tool install --python ${{ matrix.python }} dist/anihub-*.whl
          anihub version
          anihub --help

      - name: Smoke test (headless TUI, offline)
        run: uv run --no-project --isolated --python ${{ matrix.python }} --with dist/anihub-*.whl python tests/smoke_test.py

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/
